name: 🔄 Auto-Update README

on:
  schedule:
    - cron: "0 6 * * *"   # 09:00 TR
    - cron: "0 12 * * *"  # 15:00 TR
    - cron: "0 18 * * *"  # 21:00 TR
  workflow_dispatch:

jobs:
  update-readme:
    name: Fetch & Commit Dynamic Sections
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install deep-translator requests

      - name: Configure Git
        run: |
          git config user.name  "Resit Asrav"
          git config user.email "resitasrav21@gmail.com"

      # ── Stats Cards: generate SVGs locally via GitHub API ─────────────────
      - name: Generate GitHub Stats SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Commit stats SVGs
        run: |
          git add assets/
          git diff --cached --quiet && echo "No stats changes" || git commit -m "update: github stats"

      # ── Dynamic README sections ────────────────────────────────────────────
      - name: Run update_readme.py
        run: python scripts/update_readme.py

      - name: Push all commits
        run: git push
